
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Calculadora</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .calculadora {
            background-color: #333;
            padding: 20px;
            border-radius: 15px;
            width: 280px;
        }

        #visor {
            width: 100%;
            height: 50px;
            font-size: 25px;
            text-align: right;
            margin-bottom: 15px;
            box-sizing: border-box;
            border-radius: 5px;
        }

        .botoes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        button {
            height: 55px;
            font-size: 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #555;
            color: white;
        }

        button:hover {
            background-color: #777;
        }

        .operador {
            background-color: #ff9500;
        }

        .igual {
            background-color: #2196F3;
        }

        .limpar {
            background-color: #e53935;
        }
    </style>
</head>

<body>

    <div class="calculadora">

        <input type="text" id="visor" readonly>

        <div class="botoes">

            <button class="limpar" onclick="limpar()">C</button>
            <button onclick="raiz()">√</button>
            <button onclick="quadrado()">x²</button>
            <button class="operador" onclick="porcentagem()">%</button>

            <button onclick="adicionar('7')">7</button>
            <button onclick="adicionar('8')">8</button>
            <button onclick="adicionar('9')">9</button>
            <button class="operador" onclick="adicionar('/')">÷</button>

            <button onclick="adicionar('4')">4</button>
            <button onclick="adicionar('5')">5</button>
            <button onclick="adicionar('6')">6</button>
            <button class="operador" onclick="adicionar('*')">×</button>

            <button onclick="adicionar('1')">1</button>
            <button onclick="adicionar('2')">2</button>
            <button onclick="adicionar('3')">3</button>
            <button class="operador" onclick="adicionar('-')">-</button>

            <button onclick="adicionar('0')">0</button>
            <button onclick="adicionar('.')">.</button>
            <button class="igual" onclick="calcular()">=</button>
            <button class="operador" onclick="adicionar('+')">+</button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
